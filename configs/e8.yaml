# E8 — sparse autoencoder on block-8 frame activations, GPU.
model_name: openai/whisper-small
device: cuda
dtype: float16
out_dir: results/e8
store_full: false
dataset:
  loader: fleurs
  langs: [en_us, it_it, ja_jp, fr_fr, es_419]
  split: test
  n_per_lang: 400
  max_seconds: 10.0
sae:
  layer: 8
  frames_per_clip: 60        # random speech frames sampled per clip
  n_features: 6144           # 8x overcomplete (d_model=768)
  topk: 32
  epochs: 10
  batch_size: 4096
  lr: 0.001
  steering_cache: activations/e1_fleurs   # for the E6 vector comparison
  vector_slice: [200, 400]
  steer_alpha: 3.0           # E9-lite: feature-space effect of steering
  top_features: 10           # per-language table size
